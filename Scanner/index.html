<!DOCTYPE html>
<html>
<head>
  <title>WiFi Whisperer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <style>
  .leaflet-heatmap-layer {
    opacity: 0.5 !important;
  }
</style>

</head>

<body>
  <!-- ui header -->
  <div class="p-4 bg-gray-900 text-white">
    <h1 class="text-2xl font-bold">WiFi Whisperer 📡</h1>
    <button onclick="sendData()" class="mt-2 px-4 py-2 bg-blue-500 rounded">
      Scan Area
    </button>
    <button onclick="startTracking()" class="mt-2 ml-2 px-4 py-2 bg-yellow-500 rounded">
      Auto Scan
    </button>
    <button onclick="showBest()" class="mt-2 ml-2 px-4 py-2 bg-green-500 rounded">
      Find Best Spot
    </button>
  </div>

  <!-- map -->
  <div id="map" style="height: 500px;"></div>

  <script>
    const map = L.map('map').setView([39.346, -76.621], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let heatLayer = L.heatLayer([], {
        radius: 25,
        blur: 20,
        maxZoom: 17,
        gradient: {
            0.2: 'blue',
            0.4: 'lime',
            0.6: 'yellow',
            0.8: 'orange',
            1.0: 'red'
        }
    }).addTo(map);

    let trackingInterval = null; // prevents multiple loops

    function normalizeSignal(signal) {
      return Math.max(0, Math.min(1, (signal + 100) / 70));
    }

    async function loadData() {
      const res = await fetch("http://10.233.131.253:5001/data");
      const data = await res.json();

      const heatData = data.map(p => [
        p.lat,
        p.lng,
        normalizeSignal(p.signal)
      ]);

      heatLayer.setLatLngs(heatData);
    }

    function sendData() {
      navigator.geolocation.getCurrentPosition(position => {
        const point = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          signal: -30 - Math.random() * 50
        };

        fetch("http://10.233.131.253:5001/upload", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(point)
        }).then(loadData);

      }, error => {
        alert("Location access denied. Using default location.");

        const point = {
          lat: 39.346,
          lng: -76.621,
          signal: -50
        };

        fetch("http://10.233.131.253:5001/upload", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(point)
        }).then(loadData);
      });
    }

    function startTracking() {
      if (trackingInterval) return; // prevent duplicates

      trackingInterval = setInterval(sendData, 5000);
      alert("Auto scanning every 5 seconds...");
    }

    async function showBest() {
      const res = await fetch("http://10.233.131.253:5001/best");
      const best = await res.json();

      L.marker([best.lat, best.lng])
        .addTo(map)
        .bindPopup("Best WiFi Spot 🚀")
        .openPopup();
    }

    loadData();
  </script>
</body>
</html>
